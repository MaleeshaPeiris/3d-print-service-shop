version: '3.8'

services:

  db:
    image: postgres:15-alpine
    container_name: printforge-db
    environment:
      POSTGRES_DB: printforge
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yourpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    platform: linux/amd64
    container_name: printforge-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-yourpassword}
      JWT_SECRET: ${JWT_SECRET:-3d-print-shop-super-secret-key-change-this-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-$2y$10$RpddviE7LecnsOc1rvu5Bu7i.e.CImWkdzzdhJGyxAe0TQGI1I/Si}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/printforge
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  postgres_data: