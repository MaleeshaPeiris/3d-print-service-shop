<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders – 3D Print Shop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    nav {
      background: #1a1a1a;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    nav h1 { color: #00d4aa; font-size: 1.4rem; letter-spacing: 2px; }
    nav a  { color: #aaa; text-decoration: none; margin-left: 1.5rem; }
    nav a:hover { color: #00d4aa; }

    .container { max-width: 800px; margin: 2rem auto; padding: 0 1.5rem; }

    h2 { margin-bottom: 1.5rem; color: #fff; font-size: 1.2rem; letter-spacing: 1px; }

    .search-bar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 0.7rem 1rem;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }

    input:focus { border-color: #00d4aa; }

    button {
      background: #00d4aa;
      color: #000;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: #00b894; }

    .order-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .order-header h3 { color: #fff; }

    .status {
      font-size: 0.78rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-PENDING     { background: #f39c1222; color: #f39c12; }
    .status-IN_PROGRESS { background: #3498db22; color: #3498db; }
    .status-COMPLETED   { background: #00d4aa22; color: #00d4aa; }
    .status-CANCELLED   { background: #ff6b6b22; color: #ff6b6b; }

    .order-meta { font-size: 0.85rem; color: #888; line-height: 1.8; }
    .order-meta span { color: #ccc; }

    .empty { text-align: center; color: #555; padding: 3rem; font-size: 1rem; }
  </style>
</head>
<body>

<nav>
  <h1>⬡ PRINT3D</h1>
  <div>
    <a href="index.html">Products</a>
    <a href="orders.html">My Orders</a>
  </div>
</nav>

<div class="container">
  <h2>ORDERS</h2>

  <div class="search-bar">
    <input
            type="email"
            id="email-input"
            placeholder="Enter your email to find your orders..."
    />
    <button onclick="searchOrders()">Search</button>
  </div>

  <div id="orders-list">
    <p class="empty">Enter your email above to look up your orders.</p>
  </div>
</div>

<script>
  // ── Search orders by email ───────────────────────────────────────
  async function searchOrders() {
    const email = document.getElementById('email-input').value.trim();
    if (!email) return;

    const list = document.getElementById('orders-list');
    list.innerHTML = '<p class="empty">Loading...</p>';

    try {
      const res = await fetch(`/api/orders/customer?email=${encodeURIComponent(email)}`);
      const orders = await res.json();
      renderOrders(orders);
    } catch (err) {
      list.innerHTML = '<p class="empty" style="color:#ff6b6b">Failed to load orders.</p>';
    }
  }

  // ── Render order cards ───────────────────────────────────────────
  function renderOrders(orders) {
    const list = document.getElementById('orders-list');

    if (orders.length === 0) {
      list.innerHTML = '<p class="empty">No orders found for that email.</p>';
      return;
    }

    // Sort newest first
    orders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    list.innerHTML = orders.map(o => `
      <div class="order-card">
        <div class="order-header">
          <h3>${o.product.name}</h3>
          <span class="status status-${o.status}">${o.status.replace('_', ' ')}</span>
        </div>
        <div class="order-meta">
          Quantity: <span>${o.quantity}</span><br/>
          Customer: <span>${o.customerName}</span><br/>
          Placed: <span>${formatDate(o.createdAt)}</span><br/>
          Order ID: <span>#${o.id}</span>
        </div>
      </div>
    `).join('');
  }

  // ── Format ISO date to readable string ──────────────────────────
  function formatDate(isoString) {
    return new Date(isoString).toLocaleString('en-AU', {
      day: 'numeric', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  // Allow pressing Enter in the email field
  document.getElementById('email-input')
    .addEventListener('keydown', e => { if (e.key === 'Enter') searchOrders(); });
</script>
</body>
</html>
