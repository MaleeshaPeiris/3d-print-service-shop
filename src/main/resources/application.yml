spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/printforge}
    username: ${PGUSER:${DB_USERNAME:postgres}}
    password: ${PGPASSWORD:${DB_PASSWORD:yourpassword}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

jwt:
  secret: ${JWT_SECRET:printforge-fallback-secret-key-123456789}
  expiration: ${JWT_EXPIRATION:86400000}

admin:
  username: ${ADMIN_USERNAME:admin}
  # Value must be a BCrypt hash. Default = bcrypt("admin123"). Set ADMIN_PASSWORD to a BCrypt hash in production.
  password: ${ADMIN_PASSWORD:$2y$10$RpddviE7LecnsOc1rvu5Bu7i.e.CImWkdzzdhJGyxAe0TQGI1I/Si}

server:
  port: ${PORT:8080}